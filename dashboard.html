<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retail Sales Dashboard (sample data) | Dharshigaa P S</title>
<style>
:root{--bg:#eef2f1;--ink:#14213d;--muted:#4a5a6a;--line:#c9d4d2;--teal:#0f766e;--panel:#fff;--warn:#b45309;--bad:#b91c1c;
--f:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--f)}
.wrap{max-width:1040px;margin:0 auto;padding:1.25rem}
a{color:var(--teal)}
h1{font-size:1.6rem;margin:.2rem 0}
.note{background:#fdebd0;color:#7a3e07;padding:.6rem .9rem;border-radius:6px;font-size:.92rem;margin:.6rem 0 1rem}
.filters{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
label{display:grid;gap:.2rem;font-size:.85rem;font-weight:600;color:var(--muted)}
select{padding:.5rem .7rem;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff;color:var(--ink);min-width:9rem}
select:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:.8rem;margin-bottom:1rem}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.8rem}
.kpi span{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.kpi b{font-size:1.35rem}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:1rem;margin-bottom:1rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1rem}
.card h2{font-size:1rem;margin:0 0 .8rem}
.months{display:flex;align-items:flex-end;gap:.4rem;height:170px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.7rem;color:var(--muted)}
.bar{width:100%;background:var(--teal);border-radius:3px 3px 0 0;min-height:2px}
.row{display:grid;grid-template-columns:5.5rem 1fr 4.5rem;gap:.5rem;align-items:center;margin:.5rem 0;font-size:.9rem}
.track{background:#e3ebe9;border-radius:4px;height:14px}
.fill{background:var(--teal);height:100%;border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:.45rem .4rem;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:.8rem}
td.n,th.n{text-align:right}
.loss{color:var(--bad);font-weight:700}
.tag{background:#fde2e2;color:var(--bad);font-size:.75rem;font-weight:700;padding:.1rem .45rem;border-radius:999px;margin-left:.3rem}
.scroll{overflow-x:auto}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" target="_top">&larr; Back to portfolio</a>
  <h1>Retail Sales Dashboard</h1>
  <div class="note">Sample project. All figures come from made-up data for a fictional three-branch stationery and gift store.</div>

  <div class="filters">
    <label>Branch<select id="fb"></select></label>
    <label>Category<select id="fc"></select></label>
    <label>Payment mode<select id="fp"></select></label>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card"><h2>Monthly sales</h2><div class="months" id="months"></div></div>
    <div class="card"><h2>Sales by payment mode</h2><div id="pay"></div><h2 style="margin-top:1rem">Profit by category</h2><div id="cat"></div></div>
  </div>

  <div class="card scroll">
    <h2>Products by profit (loss-making products are flagged)</h2>
    <table><thead><tr><th>Product</th><th>Category</th><th class="n">Units</th><th class="n">Sales</th><th class="n">Profit</th></tr></thead><tbody id="prod"></tbody></table>
  </div>
</div>

<script>
// Sample data, generated with a fixed seed so the numbers stay the same every time.
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var r=rng(2026);
var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var BRANCHES=["Erode","Salem","Coimbatore"], PAYS=["Cash","UPI","Card"];
// name, category, price, cost, discount
var P=[["Notebook A4","Stationery",60,40,0],["Gel Pen","Stationery",10,6,0],["Geometry Box","Stationery",120,112,.15],
["Colour Pencils","Art",90,58,0],["Sketch Pad","Art",110,70,.05],["Water Colours","Art",150,98,0],
["Gift Wrap Set","Gifts",80,52,0],["Photo Frame","Gifts",250,160,.1],["Greeting Card","Gifts",40,22,0],
["School Bag","Bags",650,430,0],["Pencil Pouch","Bags",120,95,.2]];
var T=[];
for(var i=0;i<720;i++){
  var p=P[Math.floor(r()*P.length)], q=1+Math.floor(r()*6);
  var rev=p[2]*q*(1-p[4]), cost=p[3]*q;
  T.push({m:Math.floor(r()*12),b:BRANCHES[Math.floor(r()*3)],pay:PAYS[Math.floor(r()*3)],n:p[0],c:p[1],q:q,rev:rev,pr:rev-cost});
}
function $(id){return document.getElementById(id)}
function inr(x){return "\u20B9"+Math.round(x).toLocaleString("en-IN")}
function fill(sel,list){sel.innerHTML="<option>All</option>"+list.map(function(x){return "<option>"+x+"</option>"}).join("")}
var cats=[];P.forEach(function(p){if(cats.indexOf(p[1])<0)cats.push(p[1])});
fill($("fb"),BRANCHES);fill($("fc"),cats);fill($("fp"),PAYS);
function sum(a,k){return a.reduce(function(s,x){return s+x[k]},0)}
function bars(el,pairs,fmt){
  var mx=Math.max.apply(null,pairs.map(function(p){return Math.abs(p[1])}))||1;
  el.innerHTML=pairs.map(function(p){return '<div class="row"><span>'+p[0]+'</span><div class="track"><div class="fill" style="width:'+Math.max(2,Math.abs(p[1])/mx*100)+'%"></div></div><b>'+fmt(p[1])+'</b></div>'}).join("");
}
function render(){
  var b=$("fb").value,c=$("fc").value,p=$("fp").value;
  var d=T.filter(function(t){return (b=="All"||t.b==b)&&(c=="All"||t.c==c)&&(p=="All"||t.pay==p)});
  var sales=sum(d,"rev"),profit=sum(d,"pr"),n=d.length;
  var k=[["Total sales",inr(sales)],["Profit",inr(profit)],["Margin",(sales?profit/sales*100:0).toFixed(1)+"%"],["Transactions",n],["Average bill",inr(n?sales/n:0)]];
  $("kpis").innerHTML=k.map(function(x){return '<div class="kpi"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join("");
  var ms=MONTHS.map(function(_,i){return sum(d.filter(function(t){return t.m==i}),"rev")}),mx=Math.max.apply(null,ms)||1;
  $("months").innerHTML=ms.map(function(v,i){return '<div class="col" title="'+MONTHS[i]+': '+inr(v)+'"><div class="bar" style="height:'+(v/mx*130)+'px"></div>'+MONTHS[i]+'</div>'}).join("");
  bars($("pay"),PAYS.map(function(x){return [x,sum(d.filter(function(t){return t.pay==x}),"rev")]}),inr);
  bars($("cat"),cats.map(function(x){return [x,sum(d.filter(function(t){return t.c==x}),"pr")]}),inr);
  var rows=P.map(function(x){var f=d.filter(function(t){return t.n==x[0]});return {n:x[0],c:x[1],q:sum(f,"q"),rev:sum(f,"rev"),pr:sum(f,"pr")}})
    .filter(function(x){return x.q>0}).sort(function(a,b){return b.pr-a.pr});
  $("prod").innerHTML=rows.map(function(x){return "<tr><td>"+x.n+(x.pr<0?'<span class="tag">Loss</span>':"")+"</td><td>"+x.c+'</td><td class="n">'+x.q+'</td><td class="n">'+inr(x.rev)+'</td><td class="n'+(x.pr<0?" loss":"")+'">'+inr(x.pr)+"</td></tr>"}).join("");
}
["fb","fc","fp"].forEach(function(id){$(id).addEventListener("change",render)});
render();
</script>
</body>
</html>
